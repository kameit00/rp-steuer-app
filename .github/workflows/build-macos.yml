name: Build macOS apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architecture:
        description: Build architecture
        required: true
        default: both
        type: choice
        options: [both, arm64, x86_64]

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'both' || inputs.architecture == matrix.arch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'both' || inputs.architecture == matrix.arch
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.2'
          enable-cache: false
      - name: Build and test native app and ZIP
        if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'both' || inputs.architecture == matrix.arch
        run: ./build_app.sh --arch "${{ matrix.arch }}"
      - name: Upload signed ZIP and checksum
        if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'both' || inputs.architecture == matrix.arch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RP-Steuer-App-${{ matrix.arch }}
          path: |
            dist/RP-Steuer-App-*-${{ matrix.arch }}.zip
            dist/RP-Steuer-App-*-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ matrix.arch }}
          path: |
            .build/native/${{ matrix.arch }}/pyinstaller/rp-steuer-app-engine/warn-rp-steuer-app-engine.txt
          if-no-files-found: ignore
          retention-days: 7
