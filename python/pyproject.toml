[project]
name = "rp-steuer-app-engine"
version = "1.2.1"
description = "Bundled adapter for RP Steuer App using the unchanged production converters"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.3.3",
    "pandas==2.3.2",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.9",
    # Match transitive data dependencies from the production lockfile too.
    "et-xmlfile==2.0.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
    "tzdata==2025.2",
]

[dependency-groups]
build = ["pyinstaller==6.16.0"]
